[package]
name = "lightgui-tray"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "lightgui"
path = "src/main.rs"

[dependencies]
lightgui-core = { path = "../lightgui-core" }
tokio = { version = "1.38", features = ["rt-multi-thread", "sync", "time", "macros", "net", "io-util", "process"] }
parking_lot = "0.12"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[target.'cfg(windows)'.dependencies.windows-sys]
version = "0.59"
features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Shell",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
]
