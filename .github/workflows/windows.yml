name: Windows tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  SING_BOX_VERSION: "1.13.14"
  SING_BOX_SHA256: "f580782c6dd10f7691c66cea1d7c421813c5fbf7e305d1ee7ce0c3a40d196341"

jobs:
  test:
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Rust stable
        run: rustup toolchain install stable --profile minimal

      - name: Prepare the pinned sing-box test executable
        shell: pwsh
        run: |
          $name = "sing-box-$env:SING_BOX_VERSION-windows-amd64"
          $archive = Join-Path $env:RUNNER_TEMP "$name.zip"
          $expanded = Join-Path $env:RUNNER_TEMP "umbr-light-test-core"
          Invoke-WebRequest "https://github.com/SagerNet/sing-box/releases/download/v$env:SING_BOX_VERSION/$name.zip" -OutFile $archive
          $actual = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash
          if ($actual -ne $env:SING_BOX_SHA256) {
            throw "sing-box archive checksum mismatch: $actual"
          }
          Expand-Archive -LiteralPath $archive -DestinationPath $expanded
          New-Item -ItemType Directory -Path resources -Force | Out-Null
          Copy-Item -LiteralPath (Join-Path $expanded "$name/sing-box.exe") -Destination resources/sing-box.exe

      - name: Test the workspace
        run: cargo +stable test --workspace --locked
